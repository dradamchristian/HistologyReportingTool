<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Audit Admin</title><link rel="icon" href="data:,">
<style>
:root{--bg:#0b1220;--card:#101b33;--text:#eaf0ff;--muted:#a8b3cf;--border:rgba(255,255,255,.12);--accent:#7aa2ff;--good:#34d399;--bad:#fb7185;}*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(1100px 600px at 15% 0%, rgba(122,162,255,.22), transparent 60%),radial-gradient(900px 520px at 90% 10%, rgba(52,211,153,.18), transparent 55%), var(--bg);font-family:ui-sans-serif,system-ui}
main{max-width:1300px;margin:0 auto;padding:18px}.card{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
input,select,button,textarea{background:rgba(0,0,0,.22);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:8px 10px}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.small{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{cursor:pointer;color:#dbe6ff}.scroll{overflow:auto;max-height:60vh}
#editor{display:none} .pill{padding:4px 8px;border-radius:999px;border:1px solid var(--border);font-size:12px}
</style></head><body><main>
<div class='card'><h1 style='margin:0'>Audit Admin</h1><div class='small'><a href='index.html' style='color:#dbe6ff'>Back</a> · <a href='audit-dashboard.html' style='color:#dbe6ff'>Dashboard</a></div></div>
<div class='card'><div class='row'>
<input id='q' placeholder='search consultant/dataset/site/stage' style='min-width:280px;flex:2'>
<select id='dataset'><option value=''>All specimen types</option></select><select id='consultant'><option value=''>All consultants</option></select>
<input id='from' type='date'><input id='to' type='date'><button id='search'>Search</button><button id='reset'>Reset</button><span class='pill' id='count'></span>
</div><div class='small'>Click column headers to sort. Click Edit to open full record editor.</div></div>
<div class='card'><h3 style='margin:0 0 8px;'>Consultant list</h3><div class='row'><input id='newConsultant' placeholder='Add consultant name'><button id='addConsultant'>Add</button></div><div id='consultantList' class='small' style='margin-top:8px;'></div></div>
<div class='card scroll'><table id='tbl'><thead></thead><tbody></tbody></table></div>
<div class='card' id='editor'>
<h3 style='margin-top:0'>Edit audit row</h3><div class='row'><input id='editedBy' placeholder='Edited by (required)'><input id='editReason' placeholder='Reason'></div>
<div id='editFields' class='row' style='margin-top:8px'></div><div class='row' style='margin-top:10px'><button id='saveEdit'>Save</button><button id='deleteEdit' style='border-color:rgba(251,113,133,.55);color:#fecdd3'>Delete case</button><button id='cancelEdit'>Cancel</button></div>
</div>
</main><script defer src='assets/audit-admin.js'></script></body></html>
